name: OpenCodeReview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

# One review run per PR at a time. A new push or a new /open-code-review
# comment cancels the in-flight review instead of stacking duplicate runs
# that waste LLM tokens and post conflicting comments.
concurrency:
  group: ocr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same-repo PRs only (fork PRs get no secrets -> skip rather than fail
    # red on stranger PRs), and the comment trigger is gated to repo
    # collaborators so random users can't burn LLM quota on public repos.
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/open-code-review') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # OCR needs real merge-base; a shallow clone fails with
          # "Cannot find merge-base".
          fetch-depth: 0

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          # 'false' selects the OpenAI-compatible protocol (Ollama Cloud / z.ai).
          # Do NOT use '' here — the action maps an explicitly-empty string to
          # Anthropic, which then rejects llm_reasoning_effort.
          llm_use_anthropic: 'false'
          # GLM-5.x supports a steerable reasoning_effort field.
          llm_reasoning_effort: low
          effort: high
          stream_progress: 'true'
